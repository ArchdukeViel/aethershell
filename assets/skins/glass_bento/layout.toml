schema_version = "1.0.0"
node_limit = 32

[[nodes]]
id = "card"
type = "container"
x = 0.0
y = 0.0
width = 260.0
height = 96.0
background = "@surface.raised"
radius = "@radius.lg"

[[nodes]]
id = "cpu_label"
type = "text"
parent = "card"
x = 16.0
y = 16.0
value = "CPU ${metrics.cpu:0.0}%"
color = "@text.primary"
font_size_dip = 13.0

[[nodes]]
id = "cpu_bar"
type = "progress"
parent = "card"
x = 100.0
y = 20.0
width = 140.0
height = 6.0
value_source = "metrics.cpu"
min_value = 0.0
max_value = 100.0
fill = "@accent.primary"

[[nodes]]
id = "ram_label"
type = "text"
parent = "card"
x = 16.0
y = 51.0
value = "RAM ${metrics.ram:0.1} GiB"
color = "@text.secondary"
font_size_dip = 13.0

[[nodes]]
id = "ram_bar"
type = "progress"
parent = "card"
x = 100.0
y = 55.0
width = 140.0
height = 6.0
value_source = "metrics.ram"
min_value = 0.0
max_value = 16.0
fill = "@accent.secondary"
