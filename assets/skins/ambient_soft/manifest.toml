schema_version = "1.0.0"
id = "org.aethershell.ambient_soft"
name = "Ambient Soft"
version = "1.0.0"
author = "AetherShell"
license = "Apache-2.0"
engine_min = "1.0.0"
supported_widget_types = ["weather.current", "status.pill"]
layout_file = "layout.toml"
bindings_file = "bindings.toml"

[geometry]
width_dip = 200.0
height_dip = 70.0
min_scale = 0.5
max_scale = 2.0

[rendering]
preferred_mode = "surface"
max_fps = 2
needs_alpha = true

[interactions]
allowed = false
