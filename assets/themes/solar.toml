schema_version = "1.0.0"
id = "solar"
label = "Solar"
color_space = "srgb"

[colors.surface]
bg = "#FAF7F0"
raised = "#E8DED0"
overlay = "#D8CCBC"
border = "#C6BAAC"

[colors.text]
primary = "#302B28"
secondary = "#675C52"
disabled = "#9A8C7F"

[colors.accent]
primary = "#A45C2F"
secondary = "#56767B"

[colors.status]
success = "#4E7B56"
warning = "#C7862C"
danger = "#BA3C3C"

[typography]
family = "Segoe UI Variable"
mono_family = "Cascadia Mono"
scale = 1.0

[shape]
corner_radius_dip = 10.0
border_width_dip = 1.0

[motion]
fast_ms = 140
normal_ms = 240
slow_ms = 380

[effects]
surface_opacity = 0.90
glow_intensity = 0.0

[high_contrast]
use_system_colors = true

[reduced_motion]
disable_nonessential_animation = true
