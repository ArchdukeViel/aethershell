schema_version = "1.0.0"
id = "obsidian"
label = "Obsidian"
color_space = "srgb"

[colors.surface]
bg = "#090B10"
raised = "#1C2330"
overlay = "#242E40"
border = "#354257"

[colors.text]
primary = "#F3F6FC"
secondary = "#A9B5C7"
disabled = "#8D9AAA"

[colors.accent]
primary = "#A78BFA"
secondary = "#6EE7B7"

[colors.status]
success = "#6EE7B7"
warning = "#F5BE68"
danger = "#F58F9D"

[typography]
family = "Segoe UI Variable"
mono_family = "Cascadia Mono"
scale = 1.0

[shape]
corner_radius_dip = 14.0
border_width_dip = 1.0

[motion]
fast_ms = 120
normal_ms = 220
slow_ms = 350

[effects]
surface_opacity = 0.82
glow_intensity = 0.0

[high_contrast]
use_system_colors = true

[reduced_motion]
disable_nonessential_animation = true
