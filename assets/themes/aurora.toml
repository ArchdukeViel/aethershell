schema_version = "1.0.0"
id = "aurora"
label = "Aurora"
color_space = "srgb"

[colors.surface]
bg = "#111827"
raised = "#28354A"
overlay = "#34455E"
border = "#43566E"

[colors.text]
primary = "#F7F7FF"
secondary = "#ABB9D1"
disabled = "#7E8DA5"

[colors.accent]
primary = "#6EE7B7"
secondary = "#C4B5FD"

[colors.status]
success = "#6EE7B7"
warning = "#FCD34D"
danger = "#F87171"

[typography]
family = "Segoe UI Variable"
mono_family = "Cascadia Mono"
scale = 1.0

[shape]
corner_radius_dip = 16.0
border_width_dip = 1.0

[motion]
fast_ms = 100
normal_ms = 200
slow_ms = 320

[effects]
surface_opacity = 0.80
glow_intensity = 0.1

[high_contrast]
use_system_colors = true

[reduced_motion]
disable_nonessential_animation = true
