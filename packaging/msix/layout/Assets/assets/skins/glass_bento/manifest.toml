schema_version = "1.0.0"
id = "org.aethershell.glass_bento"
name = "Glass Bento System"
version = "1.0.0"
author = "AetherShell"
license = "Apache-2.0"
engine_min = "1.0.0"
supported_widget_types = ["system.metrics"]
layout_file = "layout.toml"
bindings_file = "bindings.toml"

[geometry]
width_dip = 260.0
height_dip = 96.0
min_width_dip = 180.0
max_width_dip = 600.0
min_scale = 0.5
max_scale = 2.0

[rendering]
preferred_mode = "surface"
max_fps = 5
needs_alpha = true

[interactions]
allowed = false
