schema_version = "1.0.0"
node_limit = 16

[[nodes]]
id = "spectrum_box"
type = "container"
x = 0.0
y = 0.0
width = 300.0
height = 64.0
background = "@surface.raised"
radius = "@radius.md"

[[nodes]]
id = "track_title"
type = "text"
parent = "spectrum_box"
x = 12.0
y = 10.0
value = "${media.title} — ${media.artist}"
color = "@text.primary"
font_size_dip = 12.0

[[nodes]]
id = "audio_visualizer"
type = "spectrum_visualizer"
parent = "spectrum_box"
x = 12.0
y = 30.0
width = 276.0
height = 24.0
fill = "@accent.primary"
