schema_version = "1.0.0"
id = "monochrome"
label = "Monochrome"
color_space = "srgb"

[colors.surface]
bg = "#121212"
raised = "#333333"
overlay = "#454545"
border = "#737373"

[colors.text]
primary = "#FFFFFF"
secondary = "#CBCBCB"
disabled = "#737373"

[colors.accent]
primary = "#E4E4E4"
secondary = "#A8A8A8"

[colors.status]
success = "#E4E4E4"
warning = "#C2C2C2"
danger = "#8A8A8A"

[typography]
family = "Segoe UI"
mono_family = "Consolas"
scale = 1.0

[shape]
corner_radius_dip = 4.0
border_width_dip = 1.0

[motion]
fast_ms = 120
normal_ms = 200
slow_ms = 300

[effects]
surface_opacity = 0.95
glow_intensity = 0.0

[high_contrast]
use_system_colors = true

[reduced_motion]
disable_nonessential_animation = true
