schema_version = "1.0.0"
id = "neon_grid"
label = "Neon Grid"
color_space = "srgb"

[colors.surface]
bg = "#080D18"
raised = "#17263C"
overlay = "#233959"
border = "#376B83"

[colors.text]
primary = "#F1FAFF"
secondary = "#ADC0D2"
disabled = "#6A7F93"

[colors.accent]
primary = "#00D9EE"
secondary = "#FF4FD8"

[colors.status]
success = "#00FFC2"
warning = "#FFDE59"
danger = "#FF3366"

[typography]
family = "Cascadia Code"
mono_family = "Cascadia Mono"
scale = 1.0

[shape]
corner_radius_dip = 6.0
border_width_dip = 1.5

[motion]
fast_ms = 80
normal_ms = 160
slow_ms = 260

[effects]
surface_opacity = 0.85
glow_intensity = 0.25

[high_contrast]
use_system_colors = true

[reduced_motion]
disable_nonessential_animation = true
