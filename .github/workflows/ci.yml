name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust Quality Gates & Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Script Host Binary for Out-of-Process Tests
        run: cargo build -p aethershell-script-host --bin aethershell-script-host

      - name: Run Tests
        run: cargo test --workspace --verbose
        env:
          REQUIRE_LUA_WORKER_TEST: "1"

      - name: Build Release Binaries
        run: cargo build --workspace --release
        env:
          RUSTFLAGS: "-C target-feature=+crt-static --remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=${{ runner.temp }}=~"

  cpp-winui-qualification:
    name: C++/WinUI 3 Mandatory Qualification
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore apps/aethershell-settings/packages.config -PackagesDirectory packages

      - name: Build C++/WinUI 3 Settings Application
        run: msbuild apps/aethershell-settings/aethershell-settings.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Dedicated C++ Qualification Tests (Strict Gating)
        run: cargo test -p aethershell-app --test ipc_security_authorization_test -- test_cpp_winui_settings_client --nocapture
        env:
          REQUIRE_CPP_SETTINGS_TEST: "1"
